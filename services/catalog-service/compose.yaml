services:
  catalog-db:
    image: 'mysql:8.4'
    environment:
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306' #le port 3306 est déjà utilisé par un MySQL sur mon ordinateur
    volumes:
      - catalog-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  catalog-db-data: